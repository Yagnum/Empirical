# Settle open weekend trades into the first regulated session (ADR-023).
#
# GitHub's cron is best effort: scheduled for every ten minutes through the
# morning, this job in practice started once a day, hours after the open
# (ADR-034). So it now fires well BEFORE the open and waits. `--watch` stays
# alive until regular hours, settles every open trade, and keeps checking until
# nothing is left. A run that starts on time waits a few hours for nothing but
# the clock; a run that GitHub delays by hours still reaches the open.
#
# The cron is UTC. 07:17-11:17 UTC is 2:17-6:17 AM Eastern in winter and an hour
# later in summer. Public-repo Actions minutes are free, and the concurrency
# group keeps later firings from running alongside a watch already in progress.
# With no open trades a run exits at once.
#
# Secrets: the same DATABASE_URL, ALPACA_BROKER_ID and ALPACA_BROKER_SECRET
# the sampler uses. This job DOES place orders and move cash - in the
# sandbox - which is why it never runs from a fork or a pull request.
name: Settle weekend trades

on:
  schedule:
    - cron: "17 7-11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: settle-weekend
  cancel-in-progress: false

jobs:
  settle:
    if: github.repository_owner == 'Yagnum'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run python scripts/settle_weekend.py --watch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_BROKER_ID: ${{ secrets.ALPACA_BROKER_ID }}
          ALPACA_BROKER_SECRET: ${{ secrets.ALPACA_BROKER_SECRET }}
          ALPACA_FIRM_ACCOUNT_ID: ${{ secrets.ALPACA_FIRM_ACCOUNT_ID }}
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
          # The engine wallet's public key (ADR-025): the shadow hedge's close
          # leg is built and simulated at settlement. No secret key on this host.
          SOLANA_ENGINE_PUBKEY: G7Zr6w2CTfBkrBVr3Xj5PvEqt5R7ZJDdrh8GiEDYrzAZ
